[project]
name = "telegram-knowledge-engine"
version = "0.1.0"
description = "Personal Telegram Text Archive & Search Platform (Local-first SQLite + FTS5 + Telethon Collector)"
readme = "ARCHITECTURE.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Telegram Knowledge Engine Contributors" }
]
dependencies = [
  "telethon>=1.37.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
async-db = [
  "aiosqlite>=0.20.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
